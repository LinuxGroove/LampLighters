      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#f29b38" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f29b38" stop-opacity="0"/>
