name: lantern-out
title: Lantern Out
adopt-info: lantern-out
base: core24
summary: Keep the village lanterns lit until dawn. One of your friends is blowing them out.
description: |
  Lantern Out is a social deduction party game for 4 to 10 players. At night
  the villagers keep the lanterns burning and finish their chores, while one
  or two secret Hollow snuff the lights and take villagers in the dark. Find
  a friend's empty lantern, ring the bell, argue it out, and vote.

  - Play on your local network, each on your own device, or online through
    a LinuxGroove game server
  - Fill empty seats with bots; with enough memory they think and talk in
    meetings using a small language model that runs on your own machine
    (embedded Lemonade Server, downloaded on first use)
  - Made for controllers and handhelds, fully playable with a keyboard

  On Ubuntu Core with Ubuntu Frame, `snap set lantern-out kiosk=true` runs
  the game fullscreen as a service.
grade: stable
confinement: strict
compression: lzo
license: MIT AND CC0-1.0 AND Apache-2.0
website: https://github.com/LinuxGroove/LampLighters
source-code: https://github.com/LinuxGroove/LampLighters
issues: https://github.com/LinuxGroove/LampLighters/issues

platforms:
  amd64:

plugs:
  gpu-2404:
    interface: content
    target: $SNAP/gpu-2404
    default-provider: mesa-2404

layout:
  /usr/share/libdrm:
    bind: $SNAP/gpu-2404/libdrm
  /usr/share/drirc.d:
    symlink: $SNAP/gpu-2404/drirc.d
  /usr/share/X11/XErrorDB:
    symlink: $SNAP/gpu-2404/X11/XErrorDB

environment:
  # $SNAP/bin first so lemond finds bsdtar as "tar" (see the lemonade part).
  PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
  ALSA_CONFIG_PATH: $SNAP/usr/share/alsa/alsa.conf
  XKB_CONFIG_ROOT: $SNAP/usr/share/X11/xkb

apps:
  lantern-out:
    command: bin/lantern-out
    command-chain: [bin/gpu-2404-wrapper]
    plugs: &plugs
      - wayland
      - x11
      - opengl
      - audio-playback
      - joystick
      - network
      - network-bind
      - desktop

  kiosk:
    command: bin/lantern-out-kiosk
    command-chain: [bin/gpu-2404-wrapper]
    daemon: simple
    install-mode: disable
    restart-condition: always
    plugs: *plugs

parts:
  lantern-out:
    plugin: nil
    source: .
    build-packages:
      - curl
      - unzip
      - ca-certificates
      - libfontconfig1
    stage-packages:
      - libasound2t64
      - libpulse0
      - libdecor-0-0
      - libfontconfig1
      - libudev1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libx11-6
      - libxcursor1
      - libxext6
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libdbus-1-3
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)"
    override-build: |
      # Godot version used to export; keep in step with the project.
      GODOT_VERSION=4.6.3
      BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
      curl -sSfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
      curl -sSfL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
      unzip -o -q godot.zip
      GODOT="$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      export HOME="$PWD/.home"
      TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      mkdir -p "$TEMPLATES"
      unzip -o -q -j templates.tpz templates/linux_release.x86_64 templates/version.txt -d "$TEMPLATES"
      "$GODOT" --headless --path . --import
      mkdir -p "$CRAFT_PART_INSTALL/game" "$CRAFT_PART_INSTALL/bin"
      "$GODOT" --headless --path . --export-release Linux "$CRAFT_PART_INSTALL/game/lantern-out.x86_64"
      test -f "$CRAFT_PART_INSTALL/game/lantern-out.pck"
      install -m 755 snap/local/lantern-out snap/local/lantern-out-kiosk "$CRAFT_PART_INSTALL/bin/"
      cp LICENSE CREDITS.md "$CRAFT_PART_INSTALL/game/"

  lemonade:
    plugin: nil
    # Embedded, self-contained Lemonade Server (the "lemonade-embeddable"
    # release). The game starts it privately on localhost only when bots need
    # a language model, and models download into $SNAP_USER_COMMON on first use.
    source: https://github.com/lemonade-sdk/lemonade/releases/download/v2026.39.1/lemonade-embeddable-2026.39.1-ubuntu-x64.tar.gz
    source-type: tar
    override-build: |
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/lemonade
      cp -a LICENSE lemond lemonade resources $CRAFT_PART_INSTALL/lemonade/
      # lemond downloads llama.cpp backends (.tar.xz) at runtime and unpacks
      # them with "tar" from PATH. The base snap's GNU tar can't do xz under
      # strict confinement, so link bsdtar (libarchive, xz built in) in as
      # $SNAP/bin/tar, which is first on PATH.
      mkdir -p $CRAFT_PART_INSTALL/bin
      ln -sf ../usr/bin/bsdtar $CRAFT_PART_INSTALL/bin/tar
    stage-packages:
      - libssl3t64
      - libarchive-tools

  gpu-2404:
    after: [lantern-out, lemonade]
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
    prime:
      - bin/gpu-2404-wrapper
